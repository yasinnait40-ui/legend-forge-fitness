name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for accurate git SHA

      - name: Print build info
        run: |
          echo "=== BUILD VERIFICATION ==="
          echo "Git SHA: $(git rev-parse --short HEAD)"
          echo "Full SHA: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current)"
          echo "Latest commit message: $(git log -1 --pretty=%s)"
          echo "Commit timestamp: $(git log -1 --pretty=%ci)"
          echo "=========================="
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build mobile SPA (with cache busting)
        run: bun run build:mobile
        env:
          NEW_API_KEY: ${{ secrets.NEW_API_KEY }}
          UNITY_LEVELPLAY_APP_KEY: ${{ vars.UNITY_LEVELPLAY_APP_KEY }}
          UNITY_REWARDED_AD_UNIT_ID: ${{ vars.UNITY_REWARDED_AD_UNIT_ID }}
          UNITY_INTERSTITIAL_AD_UNIT_ID: ${{ vars.UNITY_INTERSTITIAL_AD_UNIT_ID }}
          UNITY_BANNER_AD_UNIT_ID: ${{ vars.UNITY_BANNER_AD_UNIT_ID }}
          UNITY_ADS_TEST_MODE: ${{ vars.UNITY_ADS_TEST_MODE || 'true' }}

      - name: Verify build output
        run: |
          echo "=== BUILD OUTPUT VERIFICATION ==="
          echo "Git SHA in build: $(git rev-parse --short HEAD)"
          echo ""
          echo "dist/ contents:"
          ls -la dist/
          echo ""
          if [ -f dist/index.html ]; then
            echo "dist/index.html exists ✅"
          else
            echo "ERROR: dist/index.html NOT FOUND ❌"
            exit 1
          fi
          echo ""
          echo "Checking for old stale strings..."
          if grep -r "whispers from the web realm only" dist/ 2>/dev/null; then
            echo "WARNING: Old stale string found in build output!"
          else
            echo "No old stale strings in build ✅"
          fi
          echo ""
          echo "Assets in dist/:"
          find dist/ -type f | head -30
          echo "================================="
      - name: Sync Capacitor Android
        run: |
          npx cap sync android
        env:
          UNITY_LEVELPLAY_APP_KEY: ${{ vars.UNITY_LEVELPLAY_APP_KEY }}
          UNITY_REWARDED_AD_UNIT_ID: ${{ vars.UNITY_REWARDED_AD_UNIT_ID }}
          UNITY_INTERSTITIAL_AD_UNIT_ID: ${{ vars.UNITY_INTERSTITIAL_AD_UNIT_ID }}
          UNITY_BANNER_AD_UNIT_ID: ${{ vars.UNITY_BANNER_AD_UNIT_ID }}
          UNITY_ADS_TEST_MODE: ${{ vars.UNITY_ADS_TEST_MODE || 'true' }}

      - name: Decode keystore (release builds only)
        if: ${{ vars.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Build debug APK
        if: ${{ vars.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build release AAB
        if: ${{ vars.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_PATH: ../release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK build
        run: |
          echo "=== APK BUILD VERIFICATION ==="
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Debug APK built successfully ✅"
            echo "APK size: $(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
          elif [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            echo "Release AAB built successfully ✅"
            echo "AAB size: $(du -h android/app/build/outputs/bundle/release/app-release.aab | cut -f1)"
          else
            echo "ERROR: No APK or AAB output found ❌"
            find android/app/build/outputs/ -type f 2>/dev/null || echo "No build outputs directory"
            exit 1
          fi
          echo "=============================="
      - name: Upload debug APK
        if: ${{ vars.ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aethora-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload release AAB
        if: ${{ vars.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aethora-release-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
