name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "capacitor.config.ts"
      - "vite.config.android.ts"
      - "package.json"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build client SPA for Android
        run: bunx vite build --config vite.config.android.ts

      - name: Capacitor sync
        run: bunx cap sync android
        env:
          UNITY_LEVELPLAY_APP_KEY: ${{ vars.UNITY_LEVELPLAY_APP_KEY }}
          UNITY_REWARDED_AD_UNIT_ID: ${{ vars.UNITY_REWARDED_AD_UNIT_ID }}
          UNITY_INTERSTITIAL_AD_UNIT_ID: ${{ vars.UNITY_INTERSTITIAL_AD_UNIT_ID }}
          UNITY_BANNER_AD_UNIT_ID: ${{ vars.UNITY_BANNER_AD_UNIT_ID }}
          UNITY_ADS_TEST_MODE: ${{ vars.UNITY_ADS_TEST_MODE || 'true' }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Build signed release AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aethora-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aethora-release
          path: android/app/build/outputs/bundle/release/app-release.aab
