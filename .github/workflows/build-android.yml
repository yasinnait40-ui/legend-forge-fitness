name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "capacitor.config.ts"
      - "vite.config.android.ts"
      - "package.json"
      - ".github/workflows/build-android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HAS_SIGNING_SECRETS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print build info
        run: echo "=== BUILD INFO ===" && echo "Branch: ${{ github.ref_name }}" && echo "SHA: $(git rev-parse --short HEAD)" && echo "Full SHA: $(git rev-parse HEAD)" && echo "Timestamp: $(date -u)" && echo "==================="

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch AI Code for Android
        run: bun .github/workflows/patch-ai.ts

      - name: Build client SPA for Android
        run: bunx vite build --config vite.config.android.ts
        env:
          # Gemini API key for native Guide — injected into the JS bundle at build time.
          NEW_API_KEY: ${{ secrets.NEW_API_KEY }}

      - name: Write build-info.json into dist
        run: |
          echo "{\"sha\":\"$(git rev-parse --short HEAD)\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > dist/build-info.json
          echo "Build info written to dist/build-info.json"
          cat dist/build-info.json

      - name: Capacitor sync
        run: bunx cap sync android
        env:
          UNITY_LEVELPLAY_APP_KEY: ${{ vars.UNITY_LEVELPLAY_APP_KEY }}
          UNITY_REWARDED_AD_UNIT_ID: ${{ vars.UNITY_REWARDED_AD_UNIT_ID }}
          UNITY_INTERSTITIAL_AD_UNIT_ID: ${{ vars.UNITY_INTERSTITIAL_AD_UNIT_ID }}
          UNITY_BANNER_AD_UNIT_ID: ${{ vars.UNITY_BANNER_AD_UNIT_ID }}
          UNITY_ADS_TEST_MODE: ${{ vars.UNITY_ADS_TEST_MODE || 'true' }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets configured — skipping release AAB (debug APK only)."
          fi

      - name: Build signed release AAB
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aethora-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aethora-release
          path: android/app/build/outputs/bundle/release/app-release.aab
